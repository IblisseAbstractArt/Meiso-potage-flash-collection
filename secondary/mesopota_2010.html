<script>
(function () {
  const splash = document.getElementById('loadingSplash');
  const splashImg = splash ? splash.querySelector('img') : null;
  if (!splash || !splashImg) return;

  const defaultLogo = 'layout/exlogo.jpg';
  const splashFolder = 'splashs/';
  const randomSplashPool = [
    splashFolder + '1790207529947.png',
    splashFolder + '1790207555241.png',
    splashFolder + '1790207624334.png',
    splashFolder + '1790207651824.png',
    splashFolder + '1790207674429.png',
    splashFolder + '1790207718935.png',
    splashFolder + '1790207776163.png',
    splashFolder + '1790207792513.png',
    splashFolder + '1792444692627.png',
    splashFolder + 'machina.png',
    defaultLogo
  ];

  const key = 'mesopota_splash_last_shown';
  const oneDay = 24 * 60 * 60 * 1000;

  function pickRandomSplash() {
    const valid = randomSplashPool.filter(src => src && src.trim());
    return valid[Math.floor(Math.random() * valid.length)] || defaultLogo;
  }

  function canShowSplash() {
    const lastShown = Number(localStorage.getItem(key) || 0);
    return !lastShown || (Date.now() - lastShown) >= oneDay;
  }

  function setLastShown() {
    localStorage.setItem(key, String(Date.now()));
  }

  function showLogo() {
    splash.classList.remove('hidden', 'closing');
    splash.classList.add('visible');
    splashImg.src = defaultLogo;
    splashImg.alt = 'Mesopota logo';
  }

  function showSplash(src) {
    splash.classList.remove('hidden', 'closing');
    splash.classList.add('visible');
    splashImg.src = src;
    splashImg.alt = 'Mesopota splash image';
  }

  function hideSplash() {
    splash.classList.remove('visible');
    splash.classList.add('closing');

    setTimeout(() => {
      splashImg.src = defaultLogo;
      splashImg.alt = 'Mesopota logo';
      splash.classList.remove('closing');
      setTimeout(() => splash.classList.add('hidden'), 350);
    }, 420);
  }

  function triggerInteraction() {
    if (!canShowSplash()) {
      hideSplash();
      return;
    }

    setLastShown();
    showSplash(pickRandomSplash());

    setTimeout(() => {
      hideSplash();
    }, 900);
  }

  splash.addEventListener('click', triggerInteraction, { once: true });

  showLogo();
})();
</script>
